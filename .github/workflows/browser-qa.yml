name: Browser QA – article contents navigation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact commit SHA to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-qa:
    name: Chromium responsive and interaction QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.tested_sha || github.event.pull_request.head.sha }}
      BASELINE_SHA: 1abd3fc39df4650b402f5f6d31f6a2148f7a769f
      WAVE2_BASELINE_SHA: 6ae5e726d79b6aea3c87845193b9e0caa0f3ed19
      WAVE3_BASELINE_SHA: 258e96761fb8d327d06ecea9b283cc1bd9f3ea10
      WAVE4_BASELINE_SHA: fdc0a22750a024ab2dccc422084c24f51e356581
      WAVE5_BASELINE_SHA: bcdd8e48cf8a97b44917b90c40f59c5a6e348f4f
      WAVE6_BASELINE_SHA: 180c5a3880089216910f5b31b5de6a9b6b6fde38
      WAVE7_BASELINE_SHA: 80caef268f88b36c496518d35cf18209f7ff3e8f
      WAVE8_BASELINE_SHA: 815614650945db4c916f29a73c6444d00abe23c9
      WAVE9_BASELINE_SHA: 55347de6a974110071b66406404e7ab29dfef46b
      WAVE10_BASELINE_SHA: 94be232d7d0f20e589deb5910c820a6b95fc5171
      WAVE11_BASELINE_SHA: 4f48ddb65eef3f19fa4be7ff62b05b3d8e2bb8c5
      WAVE12_BASELINE_SHA: 3a566d2deb6e54e202acd4d1dc88194714477093
      WAVE13_BASELINE_SHA: 646735727573f95b337fa03977b12530b8ebff61
      WAVE14_BASELINE_SHA: 709eeb0edb22c8bdd988ec41999e087b25861143
      WAVE15_BASELINE_SHA: 1a2ca130db05a6cfe46e072235a18ecb75d2adbb
      WAVE16_BASELINE_SHA: 287b9c331e8c938b5f8152f8718e423521ee1e11
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the pre-migration baseline
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE2_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE3_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE4_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE5_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE6_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE7_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE8_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE9_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE10_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE11_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE12_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE13_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE14_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE15_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE16_BASELINE_SHA"

      - name: Verify guide generator determinism and scope
        run: |
          targets=(ai-navod-chatgpt-zacatek-bezpecne.html ai-workflow-7-kroku-gemini-notebook.html)
          printf 'Guide pages in manifest: '
          node -e "console.log(JSON.parse(require('node:fs').readFileSync('content/guides/articles.json', 'utf8')).length)"
          node scripts/build-guide-articles.js
          first_hashes=$(sha256sum "${targets[@]}")
          git status --short
          node scripts/build-guide-articles.js
          second_hashes=$(sha256sum "${targets[@]}")
          test "$first_hashes" = "$second_hashes"
          node scripts/build-guide-articles.js --check
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Generator output is not clean or touched paths outside its committed outputs:'
            git status --short
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('content/guides/articles.json', 'utf8'));
          const outputs = ['ai-navod-chatgpt-zacatek-bezpecne.html', 'ai-workflow-7-kroku-gemini-notebook.html'];
          const hashes = Object.fromEntries(outputs.map(file => [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          const report = { testedSha: process.env.TESTED_SHA, manifestPageCount: manifest.length, generatedPaths: outputs, firstAndSecondRunHashesMatch: true, checkMode: 'passed', changedFilesAfterBuild: [], outputSha256: hashes };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/guide-generator-check.json', JSON.stringify(report, null, 2));
          NODE
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install chromium

      - name: Run tests against a local HTTP server
        run: |
          mkdir -p artifacts test-results
          cp "$RUNNER_TEMP/guide-generator-check.json" artifacts/guide-generator-check.json
          printf '%s\n' "$TESTED_SHA" > artifacts/tested-sha.txt
          python3 -m http.server 4173 --bind 127.0.0.1 > test-results/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ai-novinka-datovi-agenti-lidske-schvaleni.html >/dev/null; then
              break
            fi
            sleep 1
          done
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/report.json npx playwright test tests/browser-qa.spec.js --reporter=list,json

      - name: Publish test summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.TESTED_SHA || 'unavailable';
          let report;
          try { report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8')); }
          catch { report = null; }
          const stats = report?.stats || {};
          const expected = stats.expected ?? 0;
          const failed = stats.unexpected ?? 0;
          const skipped = stats.skipped ?? 0;
          const flaky = stats.flaky ?? 0;
          const lines = [
            '## Browser QA',
            '',
            `- Tested commit: \`${sha}\``,
            `- Passed: ${expected}`,
            `- Failed: ${failed}`,
            `- Skipped: ${skipped}`,
            `- Flaky: ${flaky}`,
            '',
            failed ? 'See the uploaded report and failure screenshots for diagnostics.' : 'Screenshot and browser diagnostics are included in the artifact.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
          echo "Tested SHA: $TESTED_SHA"
          if [ -f test-results/report.json ]; then
            node -e "const r=require('./test-results/report.json'); console.log(JSON.stringify(r.stats))"
          else
            echo "No Playwright report was produced."
          fi

      - name: Upload screenshots, report, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ env.TESTED_SHA }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 14
