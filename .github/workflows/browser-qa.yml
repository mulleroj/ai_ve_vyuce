name: Browser QA – article contents navigation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - codex/ai-ve-vyuce-8n-zaverecna-migrace-vlna-23
      - codex/ai-ve-vyuce-8o-technicka-stabilizace
      - codex/ai-ve-vyuce-8p2-seo-finalizace
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact commit SHA to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-qa:
    name: Chromium responsive and interaction QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.tested_sha || github.event.pull_request.head.sha || github.sha }}
      BASELINE_SHA: 1abd3fc39df4650b402f5f6d31f6a2148f7a769f
      WAVE2_BASELINE_SHA: 6ae5e726d79b6aea3c87845193b9e0caa0f3ed19
      WAVE3_BASELINE_SHA: 258e96761fb8d327d06ecea9b283cc1bd9f3ea10
      WAVE4_BASELINE_SHA: fdc0a22750a024ab2dccc422084c24f51e356581
      WAVE5_BASELINE_SHA: bcdd8e48cf8a97b44917b90c40f59c5a6e348f4f
      WAVE6_BASELINE_SHA: 180c5a3880089216910f5b31b5de6a9b6b6fde38
      WAVE7_BASELINE_SHA: 80caef268f88b36c496518d35cf18209f7ff3e8f
      WAVE8_BASELINE_SHA: 815614650945db4c916f29a73c6444d00abe23c9
      WAVE9_BASELINE_SHA: 55347de6a974110071b66406404e7ab29dfef46b
      WAVE10_BASELINE_SHA: 94be232d7d0f20e589deb5910c820a6b95fc5171
      WAVE11_BASELINE_SHA: 4f48ddb65eef3f19fa4be7ff62b05b3d8e2bb8c5
      WAVE12_BASELINE_SHA: 3a566d2deb6e54e202acd4d1dc88194714477093
      WAVE13_BASELINE_SHA: 646735727573f95b337fa03977b12530b8ebff61
      WAVE14_BASELINE_SHA: 709eeb0edb22c8bdd988ec41999e087b25861143
      WAVE15_BASELINE_SHA: 1a2ca130db05a6cfe46e072235a18ecb75d2adbb
      WAVE16_BASELINE_SHA: 287b9c331e8c938b5f8152f8718e423521ee1e11
      WAVE17_BASELINE_SHA: e7bbb564051bfc7db9f55792acb6a37856ce04e3
      WAVE18_BASELINE_SHA: 5505c10e72de01513b70c6f8bf84d498820158b0
      WAVE19_BASELINE_SHA: 7d46df5ee7ee3e9f27c085d42f8d7611ff0b802b
      WAVE20_BASELINE_SHA: 9efd3e51b4a5d8a83edf7279bed526c8377d88b0
      SUBJECT_PAGES_BASELINE_SHA: bfd39f3973d7139aeb4632ba7a74e94ab648f7bc
      ASSISTANT_PAGES_BASELINE_SHA: 2ddaab92e024cd4bafb638f9ea0e62835ef10d27
      WAVE23_BASELINE_SHA: ccbe7322895e31240e7a42133624d9ede4bf83bd
      WAVE23_COMPLETED_GROUPS: A,B,C
      STABILITY_8O_BASELINE_SHA: 342780b03feb07232852d50a089db290688f04c5
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the pre-migration baseline
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE2_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE3_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE4_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE5_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE6_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE7_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE8_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE9_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE10_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE11_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE12_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE13_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE14_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE15_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE16_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE17_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE18_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE19_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$WAVE20_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$SUBJECT_PAGES_BASELINE_SHA"
          git fetch --no-tags --depth=1 origin "$ASSISTANT_PAGES_BASELINE_SHA"

      - name: Verify guide generator determinism and scope
        run: |
          targets=(ai-navod-chatgpt-zacatek-bezpecne.html ai-workflow-7-kroku-gemini-notebook.html)
          printf 'Guide pages in manifest: '
          node -e "console.log(JSON.parse(require('node:fs').readFileSync('content/guides/articles.json', 'utf8')).length)"
          node scripts/build-guide-articles.js
          first_hashes=$(sha256sum "${targets[@]}")
          git status --short
          node scripts/build-guide-articles.js
          second_hashes=$(sha256sum "${targets[@]}")
          test "$first_hashes" = "$second_hashes"
          node scripts/build-guide-articles.js --check
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Generator output is not clean or touched paths outside its committed outputs:'
            git status --short
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('content/guides/articles.json', 'utf8'));
          const outputs = ['ai-navod-chatgpt-zacatek-bezpecne.html', 'ai-workflow-7-kroku-gemini-notebook.html'];
          const hashes = Object.fromEntries(outputs.map(file => [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          const report = { testedSha: process.env.TESTED_SHA, manifestPageCount: manifest.length, generatedPaths: outputs, firstAndSecondRunHashesMatch: true, checkMode: 'passed', changedFilesAfterBuild: [], outputSha256: hashes };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/guide-generator-check.json', JSON.stringify(report, null, 2));
          NODE
      - name: Verify magazine generator determinism, IDs, and negative cases
        run: |
          set -euo pipefail
          node scripts/test-magazine-articles.js > "$RUNNER_TEMP/magazine-generator-negative-tests.json"
          targets=(ai-novinka-ai-duvod-premyslet.html ai-novinka-ai-ve-vzdelavani-zari-2026.html)
          node scripts/build-magazine-articles.js --check
          first_hashes=$(sha256sum "${targets[@]}")
          node scripts/build-magazine-articles.js
          second_hashes=$(sha256sum "${targets[@]}")
          test "$first_hashes" = "$second_hashes"
          node scripts/build-magazine-articles.js --check
          git diff --exit-code -- "${targets[@]}"
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Magazine generator changed committed files after repeat generation:'
            git status --short
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const outputs = ['ai-novinka-ai-duvod-premyslet.html', 'ai-novinka-ai-ve-vzdelavani-zari-2026.html'];
          const hashes = Object.fromEntries(outputs.map(file => [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          const negative = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/magazine-generator-negative-tests.json', 'utf8'));
          const report = { testedSha: process.env.TESTED_SHA, manifestOutputs: outputs, firstAndSecondRunHashesMatch: true, preAndPostGenerationCheckMode: 'passed', outputSha256: hashes, isolatedGeneratorFixtures: negative };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/magazine-generator-check.json', JSON.stringify(report, null, 2));
          NODE

      - name: Verify generated catalog pages, determinism, and negative cases
        run: |
          set -euo pipefail
          node scripts/test-catalog-pages.js > "$RUNNER_TEMP/catalog-generator-negative-tests.json"
          node scripts/build-catalog-pages.js --check
          outputs=(ai.html ai-navody.html ai-novinky.html ai-agenti.html chatgpt-pro-ucitele.html gemini-notebook.html)
          node scripts/build-catalog-pages.js --output-dir "$RUNNER_TEMP/catalog-repeat-a"
          node scripts/build-catalog-pages.js --output-dir "$RUNNER_TEMP/catalog-repeat-b"
          for file in "${outputs[@]}"; do
            cmp "$file" "$RUNNER_TEMP/catalog-repeat-a/$file"
            cmp "$RUNNER_TEMP/catalog-repeat-a/$file" "$RUNNER_TEMP/catalog-repeat-b/$file"
          done
          node scripts/build-catalog-pages.js --check
          git diff --exit-code -- "${outputs[@]}"
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const fixture=JSON.parse(fs.readFileSync('tests/fixtures/catalog-pages-wave19-baseline.json','utf8'));
          const outputs=['ai.html','ai-navody.html','ai-novinky.html','ai-agenti.html','chatgpt-pro-ucitele.html','gemini-notebook.html'];
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const cardCounts=Object.fromEntries(outputs.map(file=>[file,fixture.pages[file].cardCount]));
          const report={testedSha:process.env.TESTED_SHA,baselineSha:fixture.baselineSha,baselineFixtureMatchesWorkflow:fixture.baselineSha===process.env.WAVE19_BASELINE_SHA,cardCounts,firstAndSecondGenerationMatch:true,checkMode:'passed',outputSha256:Object.fromEntries(outputs.map(file=>[file,sha(file)])),negativeCases:JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/catalog-generator-negative-tests.json','utf8'))};
          if(!report.baselineFixtureMatchesWorkflow)throw new Error('Catalog baseline fixture does not match configured source SHA');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/catalog-generator-check.json',JSON.stringify(report,null,2));
          NODE

      - name: Verify wave 20 activity regression baseline
        run: |
          set -euo pipefail
          git show "$WAVE20_BASELINE_SHA:aktivity.html" > "$RUNNER_TEMP/aktivity-wave20-baseline.html"
          node scripts/capture-activity-baseline.js "$RUNNER_TEMP/aktivity-wave20-baseline.html" "$RUNNER_TEMP/activity-library-wave20-baseline.json"
          cmp tests/fixtures/activity-library-wave20-baseline.json "$RUNNER_TEMP/activity-library-wave20-baseline.json"
          node -e "const f=require('./tests/fixtures/activity-library-wave20-baseline.json'); if(f.baselineSha!==process.env.WAVE20_BASELINE_SHA || f.activities.length!==44 || new Set(f.activities.map(x=>x.id)).size!==44) process.exit(1)"

      - name: Verify wave 21 subject-page regression baseline
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/subject-pages-wave21-baseline"
          mkdir -p "$baseline_dir"
          for file in anglictina.html cestina.html dejepis.html matematika.html prirodoveda.html; do
            git show "$SUBJECT_PAGES_BASELINE_SHA:$file" > "$baseline_dir/$file"
          done
          node scripts/capture-subject-pages-baseline.js "$baseline_dir" "$RUNNER_TEMP/subject-pages-wave21-baseline.json"
          cmp tests/fixtures/subject-pages-wave21-baseline.json "$RUNNER_TEMP/subject-pages-wave21-baseline.json"
          node -e "const f=require('./tests/fixtures/subject-pages-wave21-baseline.json'); if(f.baselineSha!==process.env.SUBJECT_PAGES_BASELINE_SHA || Object.keys(f.pages).length!==5) process.exit(1)"

      - name: Verify wave 22 assistant-page regression baseline
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/assistant-pages-wave22-baseline"
          mkdir -p "$baseline_dir"
          for file in asistenti.html katalog-asistenti.html; do
            git show "$ASSISTANT_PAGES_BASELINE_SHA:$file" > "$baseline_dir/$file"
          done
          node scripts/assistant-pages-baseline.js "$baseline_dir" "$RUNNER_TEMP/assistant-pages-wave22-baseline.json"
          cmp tests/fixtures/assistant-pages-wave22-baseline.json "$RUNNER_TEMP/assistant-pages-wave22-baseline.json"
          node -e "const f=require('./tests/fixtures/assistant-pages-wave22-baseline.json'); if(f.baselineSha!==process.env.ASSISTANT_PAGES_BASELINE_SHA || f.pages['asistenti.html'].cards.length!==9 || f.pages['katalog-asistenti.html'].cards.length!==2) process.exit(1)"
          echo "ASSISTANT_WAVE22_BASELINE_DIR=$baseline_dir" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin "$WAVE23_BASELINE_SHA"
          node scripts/wave23-page-baseline.js "$WAVE23_BASELINE_SHA" "$RUNNER_TEMP/pages-wave23-baseline.json"
          cmp tests/fixtures/pages-wave23-baseline.json "$RUNNER_TEMP/pages-wave23-baseline.json"
          node -e "const f=require('./tests/fixtures/pages-wave23-baseline.json'); const p=f.pages; if(f.baselineSha!==process.env.WAVE23_BASELINE_SHA || Object.keys(p).length!==8 || p['prompty.html'].prompts.length!==145 || p['vibe-coding-prompty.html'].prompts.length!==11 || p['gemini-notebook-prompty.html'].prompts.length!==28) process.exit(1)"

      - name: Verify wave 8O technical-stability baseline
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$STABILITY_8O_BASELINE_SHA"
          baseline_dir="$RUNNER_TEMP/stability-8o-baseline"
          mkdir -p "$baseline_dir/asistenti" "$baseline_dir/js"
          for file in qr-kod.html asistenti/math-cermat.html asistenti/metodicky-asistent-gemini.html js/qr-kod.js; do
            mkdir -p "$baseline_dir/$(dirname "$file")"
            git show "$STABILITY_8O_BASELINE_SHA:$file" > "$baseline_dir/$file"
          done
          node scripts/capture-8o-baseline.js "$baseline_dir" "$RUNNER_TEMP/pages-8o-baseline.json"
          cmp tests/fixtures/pages-8o-baseline.json "$RUNNER_TEMP/pages-8o-baseline.json"
          node -e "const f=require('./tests/fixtures/pages-8o-baseline.json'); if(f.baselineSha!==process.env.STABILITY_8O_BASELINE_SHA || Object.keys(f.pages).length!==3 || f.pages['qr-kod.html'].forms.length!==1 || f.pages['asistenti/math-cermat.html'].promptBlocks.length!==1 || f.pages['asistenti/metodicky-asistent-gemini.html'].promptBlocks.length!==1) process.exit(1)"

      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test axe-core
          npx playwright install chromium

      - name: Run tests against a local HTTP server
        run: |
          mkdir -p artifacts artifacts/wave23 artifacts/stability-8o test-results
          cp "$RUNNER_TEMP/guide-generator-check.json" artifacts/guide-generator-check.json
          cp "$RUNNER_TEMP/magazine-generator-check.json" artifacts/magazine-generator-check.json
          cp "$RUNNER_TEMP/magazine-generator-negative-tests.json" artifacts/magazine-generator-negative-tests.json
          cp "$RUNNER_TEMP/catalog-generator-check.json" artifacts/catalog-generator-check.json
          cp "$RUNNER_TEMP/catalog-generator-negative-tests.json" artifacts/catalog-generator-negative-tests.json
          cp tests/fixtures/catalog-pages-wave19-baseline.json artifacts/catalog-pages-wave19-baseline.json
          cp tests/fixtures/activity-library-wave20-baseline.json artifacts/activity-library-wave20-baseline.json
          cp tests/fixtures/assistant-pages-wave22-baseline.json artifacts/assistant-pages-wave22-baseline.json
          cp tests/fixtures/pages-wave23-baseline.json artifacts/wave23/pages-wave23-baseline.json
          cp tests/fixtures/pages-8o-baseline.json artifacts/stability-8o/pages-8o-baseline.json
          printf '%s\n' "$TESTED_SHA" > artifacts/tested-sha.txt
          python3 -m http.server 4173 --bind 127.0.0.1 > test-results/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ai-novinka-datovi-agenti-lidske-schvaleni.html >/dev/null; then
              break
            fi
            sleep 1
          done
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/report.json npx playwright test tests/browser-qa.spec.js tests/subject-pages-a11y.spec.js tests/assistant-pages-wave22.spec.js tests/wave23-pages.spec.js tests/stability-8o.spec.js tests/seo-preflight-8p2.spec.js --reporter=list,json

      - name: Publish test summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.TESTED_SHA || 'unavailable';
          let report;
          try { report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8')); }
          catch { report = null; }
          const stats = report?.stats || {};
          const expected = stats.expected ?? 0;
          const failed = stats.unexpected ?? 0;
          const skipped = stats.skipped ?? 0;
          const flaky = stats.flaky ?? 0;
          const lines = [
            '## Browser QA',
            '',
            `- Tested commit: \`${sha}\``,
            `- Passed: ${expected}`,
            `- Failed: ${failed}`,
            `- Skipped: ${skipped}`,
            `- Flaky: ${flaky}`,
            '',
            failed ? 'See the uploaded report and failure screenshots for diagnostics.' : 'Screenshot and browser diagnostics are included in the artifact.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
          echo "Tested SHA: $TESTED_SHA"
          if [ -f test-results/report.json ]; then
            node -e "const r=require('./test-results/report.json'); console.log(JSON.stringify(r.stats))"
          else
            echo "No Playwright report was produced."
          fi

      - name: Generate wave 20 technical report
        if: always()
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs');
          let report={};
          try { report=JSON.parse(fs.readFileSync('test-results/report.json','utf8')); } catch {}
          let responsive={};
          try { responsive=JSON.parse(fs.readFileSync('artifacts/wave20-activity-responsive.json','utf8')); } catch {}
          const stats=report.stats||{};
          const widths=responsive.widths||[];
          const lines=[
            '# Technická zpráva — AI ve výuce 2.0, vlna 20',
            '',
            '- Testovaný commit: `'+(process.env.TESTED_SHA||'unavailable')+'`',
            '- Regresní baseline: `'+(process.env.WAVE20_BASELINE_SHA||'unavailable')+'`',
            '- Aktivity v baseline: 44',
            '- Browser QA: '+(stats.expected??0)+' passed, '+(stats.unexpected??0)+' failed, '+(stats.skipped??0)+' skipped, '+(stats.flaky??0)+' flaky',
            '- Responzivní šířky: '+(widths.map(x=>x.viewport+' px').join(', ')||'bez reportu'),
            '- Kontrola: 44 záznamů, všechna metadata a text karet, filtry, detaily, kopírování, klávesnice/fokus, odkazy a SEO.',
            '- Bez JavaScriptu: stránka a aktivity zůstávají čitelné, navigační odkazy fungují.',
            '- Screenshoty: wave20-aktivity-desktop-1440.png, wave20-aktivity-mobile-390.png, wave20-aktivity-mobile-390-menu.png',
            '- Rozsah: aktivity.html, css/activity-library.css, testy a baseline; bez změny obsahu aktivit nebo sdílené navigační architektury.',
            '',
            'Omezení: přístupnost byla ověřena automatizovaným Chromium ovládáním; ruční test čtečky obrazovky nebyl součástí Browser QA.'
          ];
          fs.writeFileSync('artifacts/wave20-activity-technical-report.md',lines.join('\n')+'\n');
          NODE

      - name: Generate wave 22 assistant technical report
        if: always()
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs');
          const report=(()=>{try{return JSON.parse(fs.readFileSync('artifacts/assistant-pages-wave22-report.json','utf8'))}catch{return {}}})();
          const results=(()=>{try{return JSON.parse(fs.readFileSync('test-results/report.json','utf8'))}catch{return {stats:{}}}})();
          const pages=report.pages||[];
          const lines=[
            '# Technická zpráva — AI ve výuce 2.0, vlna 22',
            '',
            '- Výchozí commit: `'+(process.env.ASSISTANT_PAGES_BASELINE_SHA||'unavailable')+'`',
            '- Testovaný commit: `'+(process.env.TESTED_SHA||'unavailable')+'`',
            '- Browser QA celého projektu: '+(results.stats?.expected??0)+' passed, '+(results.stats?.unexpected??0)+' failed, '+(results.stats?.skipped??0)+' skipped, '+(results.stats?.flaky??0)+' flaky',
            '- Karty podle regresní fixture: rozcestník '+(report.pages?.find(page=>page.file==='asistenti.html')?.cards??'n/a')+', katalog '+(report.pages?.find(page=>page.file==='katalog-asistenti.html')?.cards??'n/a'),
            '- Axe před opravami: rozcestník 37 kontrastních uzlů + 6 neshod názvů; katalog 13 kontrastních uzlů + 1 neshoda názvu.',
            '- Axe po opravách: '+pages.map(page=>page.file+': '+(page.axe?.violations?.length??'n/a')+' porušení').join('; '),
            '- Kontrola: metadata, canonical, Open Graph, texty, pořadí a počty karet, odkazy, obrázky/alt texty, ID, skripty, filtry, landmarky, klávesnice, no-JS, breakpointy a overflow.',
            '- Výstupy: screenshoty a JSON v tomto artefaktu; automatizovaná kontrola kontrastu ověřila běžný text ≥ 4,5:1 i nejméně příznivé barvy hero gradientů.',
            '',
            'Ruční kontrola čtečky obrazovky nebyla součástí automatizovaného běhu.'
          ];
          fs.writeFileSync('artifacts/assistant-pages-wave22-technical-report.md',lines.join('\n')+'\n');
          NODE

      - name: Generate wave 8O technical-stability report
        if: always()
        run: |
          mkdir -p artifacts/stability-8o
          node <<'NODE'
          const fs=require('node:fs');
          const results=(()=>{try{return JSON.parse(fs.readFileSync('test-results/report.json','utf8'))}catch{return {stats:{}}}})();
          const report=(()=>{try{return JSON.parse(fs.readFileSync('artifacts/stability-8o/technical-report.json','utf8'))}catch{return {}}})();
          const stats=results.stats||{};
          const axe=(report.axe||[]).map(item=>item.file+': '+item.violations.length+' confirmed violations').join('; ')||'report unavailable';
          const incomplete=(report.axe||[]).flatMap(page=>(page.incomplete||[]).map(item=>page.file+': '+item.id+' ('+item.count+' nodes)'));
          const widths=(report.pages||[]).map(item=>item.file+': '+(item.widths||[]).map(x=>x.viewportWidth+'px '+x.documentWidth+'/'+x.bodyWidth).join(', '));
          const nav=(report.sharedNavigation||[]).map(item=>item.file).join(', ')||'not available';
          const screenshots=report.screenshots||[];
          const lines=[
            '# Technická stabilizace — vlna 23 / etapa 8O',
            '',
            '- Výchozí HEAD / regresní baseline: `'+(process.env.STABILITY_8O_BASELINE_SHA||'unavailable')+'`',
            '- Testovaný HEAD: `'+(process.env.TESTED_SHA||'unavailable')+'`',
            '- Kompletní Browser QA: '+(stats.expected??0)+' passed, '+(stats.unexpected??0)+' failed, '+(stats.skipped??0)+' skipped, '+(stats.flaky??0)+' flaky',
            '- Axe-core: '+axe+'.',
            '- Responzivní měření (viewport/document/body): '+(widths.join(' | ')||'report unavailable'),
            '- Sdílená navigace ověřena na: '+nav+'.',
            '- QR knihovna dostupná: '+(report.qr?.libraryLoaded??'n/a')+'; PNG: '+(report.qr?.downloadedPngBytes??'n/a')+' B; režim bez knihovny ověřen: '+(report.qrLibraryUnavailable?.falseSuccess===false),
            '- Console errors: '+(report.consoleErrors?.length??0)+'; zaznamenané síťové chyby: '+(report.networkFailures?.length??0),
            '- Screenshoty: '+screenshots.length+' souborů v artefaktu `stability-8o/`.',
            '',
            '## Položky axe-core k ručnímu posouzení',
            ...(incomplete.length?incomplete.map(item=>'- '+item):['- Žádné nedokončené výsledky axe-core nebyly zaznamenány.']),
            '',
            'Automatizovaný běh nenahrazuje ruční kontrolu se čtečkou obrazovky.'
          ];
          fs.writeFileSync('artifacts/stability-8o/technical-report.md',lines.join('\n')+'\n');
          NODE

      - name: Upload screenshots, report, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ env.TESTED_SHA }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 14
